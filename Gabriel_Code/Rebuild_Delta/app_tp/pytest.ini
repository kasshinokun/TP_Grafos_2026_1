[pytest]
# Descobre testes APENAS em ./tests — evita que pytest vasculhe gui/
# em busca de "classes Test*" e gere falsos avisos de coleta para as
# dataclasses TestOrchestrator, TestCategory e TestCaseResult.
testpaths = tests

# Silencia PytestCollectionWarning globalmente: os únicos avisos
# desse tipo que ocorrem neste projeto são falsos positivos causados
# por dataclasses de domínio em gui/ cujos nomes começam com "Test".
# Erros reais de import/sintaxe continuam sendo reportados normalmente.
filterwarnings =
    ignore::pytest.PytestCollectionWarning

# Suprime aviso de mark desconhecido (@pytest.mark.integration) usado
# no teste de integração real do token GraphQL.
markers =
    integration: marca testes que fazem chamadas reais de rede (requer token GitHub válido)
